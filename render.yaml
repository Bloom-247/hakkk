services:
  - type: web
    name: hakkk
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: AEGIS_CONSOLE_URL
        value: https://decoy2.onrender.com
      - key: NODE_VERSION
        value: 22.13.0
